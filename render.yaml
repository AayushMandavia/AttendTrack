# AttendTrack Render Blueprint
services:
  - type: web
    name: attendtrack-api
    runtime: node
    plan: starter # $7/month for continuous 24/7 without idle spin-down
    region: oregon
    buildCommand: npm install && cd server && npm install && npx prisma generate --schema=prisma/schema.prisma
    startCommand: node server/src/index.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: CORS_ORIGIN
        value: https://attendtrack.vercel.app
      - key: STORAGE_PROVIDER
        value: local
      - key: DATABASE_URL
        fromDatabase:
          name: attendtrack-db
          property: connectionString

databases:
  - name: attendtrack-db
    plan: starter # $7/month persistent production PostgreSQL
    databaseName: attendtrack
    user: attendtrack
